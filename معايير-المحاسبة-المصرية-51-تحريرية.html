<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f1">
<title>موسوعة معايير المحاسبة المصرية | النسخة التحريرية</title>
<style>
:root{color-scheme:light;--paper:#f5f4f1;--ink:#202433;--muted:#697080;--accent:#5546c8;--line:#dedee6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
.frame-shell{height:100%;width:100%;padding:0;background:var(--paper)}
#encyclopedia{display:block;width:100%;height:100dvh;min-height:100vh;border:0;background:var(--paper)}
@supports(padding:max(0px)){.frame-shell{padding-top:env(safe-area-inset-top)}}
</style>
</head>
<body>
<div class="frame-shell">
<iframe id="encyclopedia" title="موسوعة معايير المحاسبة المصرية" src="./%D9%85%D8%B9%D8%A7%D9%8A%D9%8A%D8%B1-%D8%A7%D9%84%D9%85%D8%AD%D8%A7%D8%B3%D8%A8%D8%A9-%D8%A7%D9%84%D9%85%D8%B5%D8%B1%D9%8A%D8%A9-51.html"></iframe>
</div>
<script>
(function(){
const frame=document.getElementById('encyclopedia');
const editorialCSS=`
:root{--bg:#f5f4f1!important;--card:#fff!important;--ink:#202433!important;--muted:#697080!important;--line:#dedee6!important;--primary:#5546c8!important;--primary2:#7667db!important;--soft:#f0effb!important;--good:#087e68!important;--goodBg:#eaf6f1!important;--warn:#a65b17!important;--warnBg:#fbf1e5!important;--info:#246b91!important;--infoBg:#eaf3f8!important;--shadow:0 12px 32px rgba(31,35,52,.055)!important}
html{scroll-behavior:auto!important;background:var(--bg)!important}
body{background:var(--bg)!important;color:var(--ink)!important;font-family:Tahoma,"Segoe UI",Arial,sans-serif!important;line-height:1.9!important;letter-spacing:.005em}
.wrap{max-width:1160px!important;padding:clamp(12px,2.6vw,30px)!important}
.hero{background:linear-gradient(120deg,#24243a 0%,#403b82 58%,#6554c7 100%)!important;border-radius:8px 8px 26px 8px!important;padding:clamp(23px,4vw,42px)!important;margin-bottom:20px!important;box-shadow:0 14px 36px rgba(40,35,90,.12)!important;border-bottom:4px solid #a99df1!important}
.hero h1{font-size:clamp(25px,3.5vw,38px)!important;letter-spacing:-.035em!important;line-height:1.5!important}
.hero p{font-size:clamp(14px,1.5vw,16px)!important;color:#f2efff!important;max-width:850px!important}
.heroMeta{border-radius:5px!important;background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.24)!important;padding:6px 11px!important;font-size:11px!important;letter-spacing:.02em}
.toolbar{border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:none!important;padding:13px!important;margin-bottom:16px!important;gap:9px!important}
.search{border-radius:5px!important;background:#fcfcfb!important;border-color:#d5d5df!important;padding:14px 15px!important}
.filterBtn,.backBtn,.printBtn{border-radius:5px!important;padding:10px 14px!important;border-color:#d6d6e0!important;font-size:13px!important;box-shadow:none!important}
.filterBtn.active{background:#5546c8!important;border-color:#5546c8!important}
.timelinePanel,.listPanel,.detailPanel{border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:var(--shadow)!important;background:#fff!important}
.timelinePanel{padding:clamp(16px,2.5vw,26px)!important;margin-bottom:18px!important;border-top:3px solid #7667db!important}
.timelineTitle{font-size:clamp(18px,2vw,22px)!important;letter-spacing:-.02em!important;margin-bottom:8px!important}
.timelineIntro{font-size:14px!important;color:#51596a!important;max-width:950px}
.timelineGrid{gap:10px!important;margin-top:18px!important}
.tItem{background:#faf9f7!important;border:1px solid #e6e4e0!important;border-radius:5px!important;padding:14px!important}
.tItem b{color:#5546c8!important;font-size:17px!important;border-bottom:1px solid #e3e0f6;padding-bottom:5px;margin-bottom:7px!important}
.tItem span{color:#454c5b!important;font-size:13px!important}
.listHead{padding:17px 20px!important;border-bottom:1px solid #e7e5e1!important}
.listHead b{font-size:17px!important;letter-spacing:-.015em}
.count{background:#f0effb!important;color:#5143b4!important;border:1px solid #dcd8fa!important;border-radius:4px!important}
.list{padding:14px!important}
.gridList{gap:11px!important}
.standardCard{border:1px solid #e5e4e8!important;border-radius:7px!important;min-height:100px!important;padding:14px!important;grid-template-columns:58px 1fr auto!important;gap:13px!important;box-shadow:0 2px 7px rgba(30,30,45,.025)!important}
.standardCard:hover{background:#fbfaff!important;border-color:#bcb4f0!important;transform:translateY(-1px)!important;box-shadow:0 8px 18px rgba(60,48,145,.07)!important}
.stdNum{width:58px!important;height:58px!important;border-radius:5px!important;background:#f0effb!important;color:#5143b4!important;font-size:20px!important;font-variant-numeric:tabular-nums}
.stdTitle{font-size:15px!important;line-height:1.75!important;color:#25283a!important}
.stdTopic{font-size:12px!important;color:#737888!important;line-height:1.7!important}
.stdArrow{color:#8a83c9!important}
.pill{border-radius:4px!important;letter-spacing:.01em}
.pageBar{padding:4px 0 8px!important}
.breadcrumb{font-size:12px!important;letter-spacing:.02em!important;color:#707486!important}
.detailPanel{overflow:hidden!important;border-radius:8px!important}
.detail{padding:clamp(18px,3.5vw,38px)!important}
.detailHeader{padding-bottom:24px!important;border-bottom:1px solid #e7e5e1!important;position:relative}
.detailHeader:after{content:"";display:block;width:72px;height:3px;background:#7667db;position:absolute;bottom:-2px;right:0}
.titleWrap{gap:18px!important;align-items:flex-start!important}
.bigNum{min-width:68px!important;height:68px!important;border-radius:6px!important;background:#5546c8!important;box-shadow:none!important;font-size:25px!important;font-variant-numeric:tabular-nums}
h2{font-size:clamp(24px,3vw,36px)!important;line-height:1.55!important;letter-spacing:-.035em!important;color:#202238!important}
.standardLabel{font-size:12px!important;color:#777b8b!important;letter-spacing:.035em!important;margin-top:5px!important}
.detailStatus{margin-top:12px!important}
.detailGrid{gap:14px!important;margin-top:22px!important}
.infoCard{border:1px solid #e5e3df!important;border-radius:6px!important;padding:clamp(16px,2.4vw,24px)!important;background:#fff!important;box-shadow:0 2px 8px rgba(30,30,45,.018)!important}
.infoCard h3{font-size:17px!important;line-height:1.65!important;color:#302d55!important;margin-bottom:12px!important;padding-bottom:9px!important;border-bottom:1px solid #eeecf4!important}
.infoCard p,.infoCard ul{font-size:14px!important;line-height:2.05!important;color:#414858!important}
.infoCard li{margin:7px 0!important;padding-right:2px}
.dateFacts{gap:10px!important;margin:14px 0 20px!important}
.dateFacts>div{background:#faf9f7!important;border:1px solid #e7e4df!important;border-radius:5px!important;padding:14px!important}
.dateFacts b{color:#5546c8!important;font-size:12px!important}
.dateFacts span{font-size:13px!important;color:#3d4554!important}
.timeline{border-right:2px solid #d7d1f6!important}
.event{margin-bottom:19px!important}
.event:before{background:#7667db!important;border-color:#f0effb!important}
.event b{color:#5546c8!important}
.note{border-radius:5px!important;background:#f7f6fc!important;border:1px dashed #d2ccef!important;color:#56566b!important;padding:14px!important;font-size:13px!important}
.sourceBox{border-radius:5px!important;background:#faf9f7!important;border:1px solid #e5e2dc!important;padding:17px!important;line-height:2.2!important;font-size:13px!important}
.sourceBox a{color:#5143b4!important;text-decoration:underline!important;text-underline-offset:3px}
button:focus-visible,input:focus-visible{outline:3px solid #a99df1!important;outline-offset:2px!important}
@media(max-width:900px){.wrap{padding:12px!important}.detailGrid{grid-template-columns:1fr!important}.dateFacts{grid-template-columns:1fr!important}.pageBar{gap:12px!important}.standardCard{grid-template-columns:52px 1fr auto!important}.stdNum{width:52px!important;height:52px!important}}
@media(max-width:560px){.wrap{padding:10px!important}.hero{padding:23px 18px!important;border-radius:6px 6px 20px 6px!important}.hero h1{font-size:25px!important}.toolbar{padding:9px!important}.search{min-width:100%!important}.filterBtn{flex:1!important}.timelinePanel{padding:15px!important}.list{padding:8px!important}.standardCard{grid-template-columns:46px minmax(0,1fr)!important;gap:10px!important;min-height:0!important;padding:11px!important}.stdNum{width:46px!important;height:46px!important;font-size:17px!important;grid-row:1/3}.stdMain{grid-column:2}.stdTitle{font-size:13px!important}.stdTopic{font-size:11px!important}.stdArrow{display:none!important}.detail{padding:16px!important}.titleWrap{gap:12px!important}.bigNum{min-width:52px!important;height:52px!important;font-size:20px!important}.detailGrid{gap:11px!important}.infoCard{padding:15px!important}.infoCard h3{font-size:16px!important}}
@media print{.hero,.toolbar,.timelinePanel{display:none!important}.detailPanel{border:0!important}.infoCard{break-inside:avoid!important}}
`;
function apply(){try{const doc=frame.contentDocument;if(!doc||!doc.head)return;let style=doc.getElementById('editorial-overhaul');if(!style){style=doc.createElement('style');style.id='editorial-overhaul';doc.head.appendChild(style)}style.textContent=editorialCSS;}catch(e){}}
frame.addEventListener('load',apply);
})();
</script>
</body>
</html>
