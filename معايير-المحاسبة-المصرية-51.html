const q=document.getElementById("q"), list=document.getElementById("list"), detail=document.getElementById("detail");
function render(){
 const term=q.value.trim().toLowerCase();
 const arr=data.filter(s=>(filter==="all"||({live:0,update:1,new:2,off:3}[filter]??99)===s.status)&&((s.id+" "+s.name+" "+s.summary).toLowerCase().includes(term)));
 list.innerHTML=arr.length?arr.map(s=>'<button class="item '+(s.id===selected?"active":"")+'" onclick="selectStd('+s.id+')"><span class="num">'+s.id+'</span><span><b>'+s.name+'</b><br><small>'+statusText[s.status]+'</small></span></button>').join(""):'<p style="padding:18px;color:#667085">لا توجد نتائج.</p>';
}
function selectStd(id){
 selected=id; const s=data.find(x=>x.id===id);
 const extra = s.id===47?"2019: إضافة معيار الأدوات المالية، 2023: إضافة الملحق (ج).":s.id===48?"2019: إضافة معيار الإيراد من العقود مع العملاء، واستبدال المعالجات السابقة للإيراد وعقود الإنشاء في نطاقه.":s.id===49?"2019: إضافة معيار عقود التأجير بدل معيار 20.":s.id===50?"2023: إضافة معيار عقود التأمين ليحل محل معيار 37.":s.id===51?"2024: إضافة معيار القوائم المالية في اقتصادات التضخم المفرط.":s.id===13?"عدة ملاحق وتعديلات لاحقة على معالجة تغيرات أسعار الصرف.":"لا توجد في هذه النسخة بيانات تغيير محددة إضافية مثبتة لهذا الرقم.";
 detail.innerHTML='<div class="big"><div class="bigNum">'+s.id+'</div><div><h2>معيار المحاسبة المصري رقم '+s.id+'<br>'+s.name+'</h2><div class="muted">'+s.summary+'</div></div></div>'+
 '<div class="box"><b>الحالة:</b> <span class="tag">'+statusText[s.status]+'</span><br><b>مرحلة الإصدار:</b> '+s.birth+'</div>'+
 '<div class="box"><b>🕘 أبرز التاريخ والتحديثات</b><p>'+extra+'</p></div>'+
 '<div class="box"><b>📘 شرح للمذاكرة</b><p>افهم أولًا المشكلة المحاسبية التي يعالجها المعيار، ثم نطاق التطبيق والتعريفات، وبعد ذلك الاعتراف والقياس، ثم العرض والإفصاح والاستثناءات. الشرح هنا تعليمي ومبسط وليس بديلًا عن النص الرسمي.</p></div>'+
 '<div class="box"><a target="_blank" href="https://fra.gov.eg/معايير-المحاسبة-المصرية/">↗ الهيئة العامة للرقابة المالية — معايير المحاسبة المصرية</a></div>';
 render();
}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;render()});
q.oninput=render; render(); selectStd(1);
</script>
</body>
</html>
