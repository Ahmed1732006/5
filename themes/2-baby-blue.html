<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>بيبي بلو</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ─── Reset & Variables ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Baby Blue Calm palette */
            --primary: #7DD3FC;
            --primary-light: #BAE6FD;
            --primary-dark: #38BDF8;
            --primary-bg: #F0F9FF;
            --gold: #C4B5FD;
            --gold-light: #E0D7FF;
            --gold-bg: #F5F3FF;
            --purple: #5EEAD4;
            --purple-light: #99F6E4;
            --purple-bg: #F0FDFA;
            --bg: #F6FBFF;
            --surface: #FFFFFF;
            --surface-alt: #EEF8FF;
            --border: #DCEEFB;
            --border-light: #EEF8FF;
            --text: #1E3A5F;
            --text-secondary: #5B7A93;
            --text-muted: #9FBDD1;
            --shadow-sm: 0 1px 4px rgba(56,189,248,.08);
            --shadow: 0 6px 20px rgba(56,189,248,.10);
            --shadow-md: 0 12px 34px rgba(56,189,248,.13);
            --shadow-lg: 0 22px 56px rgba(56,189,248,.16);
            --radius: 22px;
            --radius-sm: 14px;
            --radius-full: 9999px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Outfit', sans-serif;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-ar);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            width: 100%;
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ─── Typography ─── */
        .en-font {
            font-family: var(--font-en);
        }

        /* ─── Animations ─── */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .anim-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }
        .anim-fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        .anim-scale-in {
            animation: scaleIn 0.35s ease forwards;
        }

        .stagger-1 {
            animation-delay: 0.05s;
        }
        .stagger-2 {
            animation-delay: 0.10s;
        }
        .stagger-3 {
            animation-delay: 0.15s;
        }
        .stagger-4 {
            animation-delay: 0.20s;
        }
        .stagger-5 {
            animation-delay: 0.25s;
        }
        .stagger-6 {
            animation-delay: 0.30s;
        }
        .stagger-7 {
            animation-delay: 0.35s;
        }

        .opacity-0 {
            opacity: 0;
        }

        /* ─── App Container ─── */
        #app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 48px;
            width: 100%;
            overflow-x: hidden;
        }

        /* ─── Login ─── */
        .login-wrap {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
            padding: 20px;
            width: 100%;
        }
        .login-brand {
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 2.6rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .login-brand span {
            color: var(--text);
        }
        .login-sub {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 28px;
        }
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
        }
        .login-btn {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            transition: all var(--transition);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            width: 100%;
            cursor: pointer;
            font-family: var(--font-ar);
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .login-btn.admin {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .login-btn.admin:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .login-btn.member {
            background: var(--surface);
            border-color: var(--border);
        }
        .login-btn.member:hover {
            background: var(--surface-alt);
            border-color: var(--border);
        }
        .login-note {
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-width: 280px;
            line-height: 1.7;
        }

        /* ─── Header ─── */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 -20px 24px;
            width: calc(100% + 40px);
            box-sizing: border-box;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-ar);
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--text);
            cursor: pointer;
            transition: opacity var(--transition);
            user-select: none;
            flex-shrink: 0;
        }
        .header-brand:hover {
            opacity: 0.8;
        }
        .header-brand .mark {
            color: var(--primary);
            display:flex;align-items:center;gap:9px;
        }
        .header-brand .site-logo-image{
            width:40px;height:40px;object-fit:cover;border-radius:11px;display:block;
            background:var(--primary-bg);border:1px solid var(--border);
            box-shadow:var(--shadow-sm);flex:none;
        }
        .manager-trigger-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
        .manager-trigger-wrap .manager-label{font-size:.57rem;font-weight:900;color:#a66a00;line-height:1;white-space:nowrap}
        .manager-trigger{width:30px!important;height:30px!important;border-radius:50%!important}


        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }


        /* زر إدارة المستخدمين — يظهر للأدمن فقط */
        .admin-panel-trigger {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--primary);
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .admin-panel-trigger:hover {
            border-color: var(--primary-light);
            background: var(--primary-bg);
            transform: translateY(-1px);
        }
        .admin-panel-trigger:active {
            transform: scale(0.95);
        }

        /* Profile Trigger */
        .profile-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 12px 3px 4px;
            border-radius: var(--radius-full);
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            flex-shrink: 0;
        }
        .profile-trigger:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
        .profile-trigger .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-bg) center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color var(--transition);
        }
        .profile-trigger:hover .avatar {
            border-color: var(--primary-light);
        }
        .profile-trigger .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-trigger .pname {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-trigger .pchevron {
            color: var(--text-muted);
            font-size: 0.65rem;
            transition: transform var(--transition);
        }
        .profile-trigger.open .pchevron {
            transform: rotate(180deg);
        }

        /* Profile Dropdown */
        .profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            min-width: 210px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: all var(--transition);
            z-index: 60;
        }
        .profile-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .profile-dropdown .d-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: default;
        }
        .profile-dropdown .d-item strong {
            color: var(--text);
            font-weight: 700;
            min-width: 60px;
        }
        .profile-dropdown .d-item .d-val {
            color: var(--text-secondary);
            word-break: break-all;
        }
        .profile-dropdown .d-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }
        .profile-dropdown .d-action {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text);
            background: transparent;
            border: none;
            width: 100%;
            text-align: right;
            cursor: pointer;
            transition: background var(--transition);
            font-family: var(--font-ar);
        }
        .profile-dropdown .d-action:hover {
            background: var(--surface-alt);
        }
        .profile-dropdown .d-action i {
            width: 18px;
            text-align: center;
            color: var(--purple);
        }
        .profile-dropdown .d-action.danger {
            color: #EF4444;
        }
        .profile-dropdown .d-action.danger i {
            color: #EF4444;
        }

        /* ─── Full Profile Page ─── */
        .phone-required-box { max-width:460px; }
        .phone-required-icon { width:64px;height:64px;border-radius:18px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 14px; }
        .profile-page { max-width: 900px; margin: 0 auto; padding: 28px 16px 50px; }
        .profile-page-head { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
        .profile-back { border:1px solid var(--border); background:var(--surface); color:var(--text); width:42px; height:42px; border-radius:12px; cursor:pointer; box-shadow:var(--shadow-sm); }
        .profile-page-title h2 { margin:0; font-size:1.35rem; color:var(--text); }
        .profile-page-title p { margin:5px 0 0; color:var(--text-muted); font-size:.85rem; }
        .profile-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-sm); overflow:hidden; }
        .profile-hero { padding:28px; display:flex; align-items:center; gap:20px; background:linear-gradient(135deg,var(--primary-bg),var(--surface)); border-bottom:1px solid var(--border); }
        .profile-large-avatar { width:92px; height:92px; border-radius:50%; background:var(--primary-bg) center/cover no-repeat; border:3px solid var(--surface); box-shadow:var(--shadow-md); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:2rem; font-weight:800; overflow:hidden; flex-shrink:0; }
        .profile-large-avatar img { width:100%; height:100%; object-fit:cover; }
        .profile-hero h3 { margin:0 0 5px; font-size:1.25rem; color:var(--text); }
        .profile-role { display:inline-flex; align-items:center; gap:6px; color:var(--primary); background:var(--surface); border:1px solid var(--border); padding:5px 10px; border-radius:999px; font-size:.75rem; font-weight:700; }
        .profile-info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; }
        .profile-info-row { padding:18px 22px; border-bottom:1px solid var(--border); }
        .profile-info-row:nth-child(odd) { border-left:1px solid var(--border); }
        .profile-info-label { color:var(--text-muted); font-size:.76rem; margin-bottom:7px; }
        .profile-info-value { color:var(--text); font-weight:700; word-break:break-word; }
        .profile-actions { padding:20px 22px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .profile-page-btn { min-height:48px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:var(--font-ar); font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; }
        .profile-page-btn:hover { background:var(--surface-alt); }
        .profile-page-btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .profile-page-btn.danger { color:#ef4444; }
        @media (max-width:700px) { .profile-page { padding:20px 12px 40px; } .profile-hero { padding:22px 18px; } .profile-info-grid { grid-template-columns:1fr; } .profile-info-row:nth-child(odd) { border-left:none; } .profile-actions { grid-template-columns:1fr; padding:18px; } }

        /* ─── Welcome Section ─── */
        .welcome-section {
            background: linear-gradient(145deg, #ffffff 0%, #f8fbff 100%);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px 22px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            overflow: hidden;
        }
        .welcome-section .greeting h1 {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.3;
        }
        .welcome-section .greeting h1 span {
            color: var(--primary);
        }
        .welcome-section .greeting p {
            display:none;
        }
        .welcome-greeting-row {
            display:flex;
            flex-direction:row;
            direction:ltr;
            align-items:center;
            justify-content:center;
            gap:28px;
            min-width:0;
        }
        .welcome-user-avatar {
            width:150px;
            height:150px;
            min-width:150px;
            padding:0;
            border:3px solid var(--surface);
            border-radius:50%;
            background:var(--primary-bg);
            color:var(--primary);
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            box-shadow:0 5px 18px rgba(15,23,42,.12), 0 0 0 2px var(--border);
            cursor:pointer;
            transition:transform .22s ease, box-shadow .22s ease;
            font-size:1.35rem;
            font-weight:800;
            line-height:1;
        }
        .welcome-user-avatar:hover {
            transform:translateY(-3px) scale(1.035);
            box-shadow:0 8px 22px rgba(15,23,42,.16), 0 0 0 3px var(--primary-light);
        }
        .welcome-user-avatar img {
            display:block;
            width:100%;
            height:100%;
            max-width:none;
            object-fit:cover;
            object-position:center;
            border-radius:50%;
        }
        .welcome-section .greeting {
            min-width:0;
            flex:1;
            direction:rtl;
            text-align:right;
        }
        .welcome-section .greeting h1 {
            margin:0;
            font-size:clamp(1.15rem,2.8vw,1.55rem);
            line-height:1.7;
            white-space:normal;
        }
        @media (max-width:700px) {
            .welcome-section { padding:24px 16px 22px; }
            .welcome-greeting-row { gap:18px; justify-content:flex-start; }
            .welcome-user-avatar { width:120px; height:120px; min-width:120px; }
            .welcome-section .greeting { text-align:right; }
        }

        /* ─── Section Label ─── */
        .section-label {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label i {
            color: var(--primary);
            font-size: 0.95rem;
        }

        /* ─── Box Cards (Level 1) ─── */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
            width: 100%;
        }

        .box-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px 14px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }
        .box-card .card-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            border-radius: var(--radius);
            transition: transform 0.4s ease;
            z-index: 0;
        }
        .box-card .card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.0) 40%, rgba(15, 23, 42, 0.30) 100%);
            border-radius: var(--radius);
        }
        .box-card .card-image.placeholder {
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box-card .card-image.placeholder::after {
            display: none;
        }
        .box-card .card-image.placeholder i {
            font-size: 2.6rem;
            color: var(--primary-light);
            opacity: 0.5;
        }
        .box-card .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            text-align: center;
            margin-top: auto;
            padding-bottom: 4px;
            width: 100%;
        }
        .box-card .card-title.dark {
            color: var(--text);
            text-shadow: none;
        }
        .box-card .card-image.placeholder+.card-title {
            color: var(--text);
            text-shadow: none;
        }
        .box-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .box-card:active {
            transform: translateY(-1px) scale(0.98);
        }
        .box-card:hover .card-image {
            transform: scale(1.03);
        }

        /* ─── Admin Controls on Cards ─── */
        .card-admin-actions {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 4px;
            z-index: 5;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .box-card:hover .card-admin-actions,
        .sub-card:hover .card-admin-actions,
        .item-row:hover .card-admin-actions {
            opacity: 1;
        }
        .card-admin-actions button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: var(--shadow-sm);
        }
        .card-admin-actions button:hover {
            background: var(--surface);
            border-color: var(--primary);
            color: var(--primary);
        }
        .card-admin-actions button.danger:hover {
            color: #EF4444;
            border-color: #EF4444;
        }
        /* On mobile always visible */
        @media (max-width: 768px) {
            .card-admin-actions {
                opacity: 1;
                top: 6px;
                left: 6px;
            }
            .card-admin-actions button {
                width: 32px;
                height: 32px;
                font-size: 0.7rem;
                background: rgba(255, 255, 255, 0.95);
            }
        }

        /* Add card */
        .add-card {
            border: 2px dashed var(--border) !important;
            background: var(--surface) !important;
            cursor: pointer;
            transition: all var(--transition);
            aspect-ratio: 1 / 1;
        }
        .add-card:hover {
            border-color: var(--primary-light) !important;
            background: var(--primary-bg) !important;
        }
        .add-card .add-content {
            text-align: center;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }
        .add-card .add-content i {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .add-card .add-content span {
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* ─── Sub Cards (Level 2) ─── */
        .grid-subs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            max-width: 520px;
            margin-bottom: 12px;
            width: 100%;
        }

        .sub-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 12px 12px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .sub-card .card-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            border-radius: var(--radius-sm);
            transition: transform 0.4s ease;
            z-index: 0;
        }
        .sub-card .card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.0) 40%, rgba(15, 23, 42, 0.30) 100%);
            border-radius: var(--radius-sm);
        }
        .sub-card .card-image.placeholder {
            background: var(--purple-bg);
        }
        .sub-card .card-image.placeholder::after {
            display: none;
        }
        .sub-card .card-image.placeholder i {
            font-size: 2rem;
            color: var(--purple-light);
            opacity: 0.4;
        }
        .sub-card .card-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            text-align: center;
            margin-top: auto;
            padding-bottom: 2px;
            width: 100%;
        }
        .sub-card .card-title.dark {
            color: var(--text);
            text-shadow: none;
        }
        .sub-card .card-image.placeholder+.card-title {
            color: var(--text);
            text-shadow: none;
        }
        .sub-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .sub-card:active {
            transform: translateY(-1px) scale(0.97);
        }
        .sub-card:hover .card-image {
            transform: scale(1.04);
        }
        .sub-card .card-admin-actions {
            position: absolute;
            top: 6px;
            left: 6px;
            display: flex;
            gap: 3px;
            z-index: 5;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .sub-card:hover .card-admin-actions {
            opacity: 1;
        }
        .sub-card .card-admin-actions button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.6rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .sub-card .card-admin-actions button:hover {
            background: var(--surface);
            border-color: var(--primary);
            color: var(--primary);
        }
        .sub-card .card-admin-actions button.danger:hover {
            color: #EF4444;
            border-color: #EF4444;
        }
        @media (max-width: 768px) {
            .sub-card .card-admin-actions {
                opacity: 1;
                top: 4px;
                left: 4px;
            }
            .sub-card .card-admin-actions button {
                width: 30px;
                height: 30px;
                font-size: 0.65rem;
                background: rgba(255, 255, 255, 0.95);
            }
        }

        .sub-card.add-card {
            aspect-ratio: 1 / 1;
            border: 2px dashed var(--border) !important;
            background: var(--surface) !important;
        }
        .sub-card.add-card:hover {
            border-color: var(--purple-light) !important;
            background: var(--purple-bg) !important;
        }
        .sub-card.add-card .add-content i {
            color: var(--purple);
        }

        /* ─── Items (Level 3) ─── */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            width: 100%;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            width: 100%;
            flex-wrap: nowrap;
        }
        .item-row:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow);
        }
        .item-thumb {
            width: 72px;
            height: 58px;
            border-radius: var(--radius-sm);
            background: var(--surface-alt) center/cover no-repeat;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .item-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-thumb.placeholder {
            background: var(--primary-bg);
            color: var(--primary-light);
            font-size: 1.2rem;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text);
            word-break: break-word;
        }
        .item-name.empty {
            color: var(--text-muted);
            font-weight: 400;
            font-style: italic;
        }
        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }
        .item-actions .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.7rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-ar);
        }
        .item-actions .btn-download:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow-sm);
        }
        .item-actions .btn-download:active {
            transform: scale(0.96);
        }
        .item-actions .btn-download i {
            font-size: 0.65rem;
        }
        .item-actions .btn-download.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .item-row .card-admin-actions {
            position: static;
            opacity: 1;
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .item-row .card-admin-actions button {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-row .card-admin-actions button:hover {
            background: var(--surface);
            border-color: var(--primary);
            color: var(--primary);
        }
        .item-row .card-admin-actions button.danger:hover {
            color: #EF4444;
            border-color: #EF4444;
        }
        .item-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 28px 0;
            font-size: 0.9rem;
        }
        .item-empty i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.3;
        }

        /* ─── Breadcrumbs ─── */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding: 4px 0;
            flex-wrap: wrap;
        }
        .breadcrumb .seg {
            cursor: pointer;
            transition: color var(--transition);
            font-weight: 500;
        }
        .breadcrumb .seg:hover {
            color: var(--text);
        }
        .breadcrumb .seg.current {
            color: var(--text);
            font-weight: 700;
            cursor: default;
        }
        .breadcrumb .sep {
            opacity: 0.4;
            font-weight: 300;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 14px;
            font-family: var(--font-ar);
        }
        .back-link:hover {
            border-color: var(--primary-light);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .back-link i {
            font-size: 0.75rem;
        }

        /* ─── Page Header ─── */
        .page-header {
            margin-bottom: 20px;
        }
        .page-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text);
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 1px;
        }

        /* ─── Modals ─── */
        .overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.50);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 12px;
            animation: fadeIn 0.25s ease;
            overflow-y: auto;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px 26px;
            width: calc(100% - 24px);
            max-width: 440px;
            max-height: calc(100vh - 24px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.3s ease;
            overflow-y: auto;
            overflow-x: hidden;
            margin: auto;
            position: relative;
        }
        .modal h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal h3 i {
            color: var(--primary);
        }
        .modal .field {
            margin-bottom: 14px;
        }
        .modal .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }
        .modal .field input[type="text"],
        .modal .field input[type="email"],
        .modal .field input[type="password"] {
            width: 100%;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.88rem;
            font-family: var(--font-ar);
            transition: border-color var(--transition);
            box-sizing: border-box;
        }
        .modal .field input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }
        .modal .field input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .modal .file-pick {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            flex-wrap: wrap;
        }
        .modal .file-pick .prev {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--border) center/cover no-repeat;
            flex-shrink: 0;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.7rem;
        }
        .modal .file-pick .prev.has-image {
            background-size: cover;
            background-position: center;
        }
        .modal .file-pick .upl {
            background: var(--surface);
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all var(--transition);
            color: var(--text-secondary);
            font-family: var(--font-ar);
        }
        .modal .file-pick .upl:hover {
            border-color: var(--primary-light);
            color: var(--text);
        }
        .modal .file-pick input[type="file"] {
            display: none;
        }
        .modal .file-pick .fname {
            font-size: 0.75rem;
            color: var(--text-muted);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 60px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .modal-actions button {
            flex: 1;
            min-width: 80px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.82rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-ar);
        }
        .modal-actions .btn-save {
            background: var(--primary);
            color: #fff;
        }
        .modal-actions .btn-save:hover {
            background: var(--primary-dark);
        }
        .modal-actions .btn-cancel {
            background: var(--surface-alt);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .modal-actions .btn-cancel:hover {
            background: var(--border);
        }
        .modal-actions .btn-danger {
            background: #EF4444;
            color: #fff;
        }
        .modal-actions .btn-danger:hover {
            background: #DC2626;
        }
        .modal .btn-danger.block {
            width: 100%;
            margin-top: 8px;
        }

        /* ─── Confirm ─── */
        .confirm-box {
            text-align: center;
        }
        .confirm-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: var(--surface);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.82rem;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            font-family: var(--font-ar);
            text-align: center;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #065F46;
            color: #ECFDF5;
        }
        .toast.error {
            background: #991B1B;
            color: #FEF2F2;
        }
        .toast.info {
            background: #1E3A5F;
            color: #E0F2FE;
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .overlay {
                padding: 8px;
            }
            .modal {
                width: min(100%, 440px);
                max-width: 100%;
                max-height: calc(100vh - 16px);
                padding: 18px 16px;
            }

            #app {
                padding: 0 14px 32px;
            }
            .header {
                padding: 0 14px;
                margin: 0 -14px 18px;
                height: 56px;
                width: calc(100% + 28px);
            }
            .header-brand {
                font-size: 1.05rem;
            }
            .admin-panel-trigger {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
            .profile-trigger {
                padding: 2px 8px 2px 3px;
            }
            .profile-trigger .pname {
                font-size: 0.75rem;
                max-width: 60px;
            }
            .profile-trigger .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .profile-dropdown {
                left: 0;
                right: auto;
                min-width: 220px;
            }
            .welcome-section {
                padding: 18px 20px;
            }
            .welcome-section .greeting h1 {
                font-size: 1.15rem;
            }
            .grid-boxes {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
            .grid-subs {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                max-width: 100%;
            }
            .box-card {
                min-height: 120px;
                padding: 12px 10px 10px;
            }
            .box-card .card-title {
                font-size: 0.85rem;
            }
            .sub-card {
                padding: 12px 10px 10px;
            }
            .sub-card .card-title {
                font-size: 0.8rem;
            }
            .item-row {
                flex-wrap: nowrap;
                gap: 10px;
                padding: 10px 12px;
            }
            .item-thumb {
                width: 60px;
                height: 50px;
            }
            .item-actions .btn-download {
                padding: 4px 10px;
                font-size: 0.65rem;
            }
            .item-name {
                font-size: 0.82rem;
            }
            .modal {
                padding: 18px 16px;
                width: calc(100% - 16px);
                max-height: calc(100vh - 16px);
            }
            .modal .file-pick {
                padding: 4px 10px;
            }
            .modal .file-pick .prev {
                width: 34px;
                height: 34px;
            }
            .card-admin-actions button {
                width: 30px;
                height: 30px;
                font-size: 0.65rem;
            }
            .sub-card .card-admin-actions button {
                width: 28px;
                height: 28px;
                font-size: 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .overlay {
                padding: 6px;
            }
            .modal {
                width: 100%;
                max-width: 100%;
                max-height: calc(100vh - 12px);
                padding: 14px 12px;
            }

            #app {
                padding: 0 10px 24px;
            }
            .header {
                padding: 0 10px;
                margin: 0 -10px 14px;
                height: 50px;
                width: calc(100% + 20px);
            }
            .header-brand {
                font-size: 0.95rem;
            }
            .admin-panel-trigger {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }
            .profile-trigger .pname {
                max-width: 44px;
                font-size: 0.7rem;
            }
            .profile-trigger .avatar {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .grid-boxes {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .grid-subs {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .box-card {
                min-height: 100px;
                padding: 10px 8px 8px;
            }
            .box-card .card-title {
                font-size: 0.75rem;
            }
            .sub-card {
                padding: 10px 8px 8px;
            }
            .sub-card .card-title {
                font-size: 0.72rem;
            }
            .welcome-section .greeting h1 {
                font-size: 1rem;
            }
            .welcome-section .greeting p {
                font-size: 0.82rem;
            }
            .item-row {
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 10px;
            }
            .item-thumb {
                width: 56px;
                height: 46px;
            }
            .item-name {
                font-size: 0.78rem;
            }
            .item-actions .btn-download {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
            .modal {
                padding: 14px 12px;
                width: calc(100% - 12px);
            }
            .modal h3 {
                font-size: 0.95rem;
            }
            .modal .field input {
                font-size: 0.8rem;
                padding: 7px 10px;
            }
            .modal-actions button {
                font-size: 0.75rem;
                padding: 8px 10px;
                min-width: 60px;
            }
            .card-admin-actions button {
                width: 26px;
                height: 26px;
                font-size: 0.55rem;
            }
            .sub-card .card-admin-actions button {
                width: 24px;
                height: 24px;
                font-size: 0.5rem;
            }
            .profile-dropdown {
                left: 0;
                right: auto;
                min-width: 220px;
                padding: 10px;
            }
            .profile-dropdown .d-item {
                font-size: 0.72rem;
            }
            .profile-dropdown .d-action {
                font-size: 0.72rem;
                padding: 6px 8px;
            }
            .breadcrumb {
                font-size: 0.72rem;
            }
            .back-link {
                font-size: 0.72rem;
                padding: 5px 12px;
            }
            .section-label {
                font-size: 0.95rem;
            }
            .page-header h2 {
                font-size: 1.1rem;
            }
            .login-brand {
                font-size: 2rem;
            }
            .login-sub {
                font-size: 0.85rem;
            }
            .login-btn {
                padding: 12px 16px;
                font-size: 0.85rem;
            }
        }

        /* ─── Platform Manager ─── */

        /* منصة مدير المنصة — صفحة مستقلة داخل التطبيق */
        .manager-page{max-width:1000px;margin:0 auto;padding:34px 18px 70px}
        .manager-page-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
        .manager-page-head h2{margin:0;font-size:1.55rem}

        async function uploadFile(bucket,file,folder='uploads'){
            if(!file) return null;
            if(!(file instanceof File)) throw new Error('ملف الرفع غير صالح.');
            const path=`${folder}/${crypto.randomUUID()}_${safeFileName(file.name||'file')}`;
            const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,cacheControl:'3600',contentType:file.type||'application/octet-stream'});
            if(error) throw new Error(`فشل رفع الملف إلى Storage: ${error.message}`);
            return path;
        }

        async function downloadMaterial(item) {
            const path = item?.filePath || item?.fileData;
            if (!path) return showToast('لا يوجد ملف لهذه المادة', 'error');
            if (/^https?:\/\//i.test(path)) {
                window.open(path, '_blank', 'noopener');
                return;
            }
            try {
                const { data, error } = await sb.storage.from('materials').createSignedUrl(path, 300);
                if (error) throw error;
                window.open(data.signedUrl, '_blank', 'noopener');
            } catch (e) {
                showToast(e.message || 'تعذّر تحميل الملف', 'error');
            }
        }

            if (!data) return;
            const link = document.createElement('a');
            link.href = data;
            link.download = name || 'download';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            el.textContent = msg;
            el.className = 'toast ' + type;

            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.remove('show');
            }, 3000);

        // ─── Admin: User Management (inside 2.html) ───

        function escapeHtml(value){
            return String(value ?? '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        const PROFILE_TITLE_PRESETS = [
            'قمر','نجمة','وردة','ميوش','ميموية','صحبي','صحبتي','صديقي','صديقتي','أمير','ملكة',
            'نجم','كوكب','لؤلؤة','فراشة','سكر','عسل','برنس','برنسيسة','شطور','جدع','باشا','باشمهندس',
            'فنان','فنانة','مبدع','مبدعة','أسطورة','روح حلوة','الجامد','الجامدة','الرايق','الرايقة',
            'الكابتن','الزعيم','الملكة','الأمير','نجم اليوم','صاحبنا','صاحبتنا','رفيق','رفيقة','غالي','غالية'
        ];
        function titleList(value){
            if(Array.isArray(value)) return value.map(v=>String(v).trim()).filter(Boolean);
            return String(value||'').split(/[,،|]/).map(v=>v.trim()).filter(Boolean);
        }
        function renderTitleChips(value, cls='title-chips'){
            const arr=titleList(value);
            return arr.length ? `<div class="${cls}">${arr.map(t=>`<span class="title-chip">✦ ${escapeHtml(t)}</span>`).join('')}</div>` : '';
        }
        function renderTitlePicker(value){
            const selected=titleList(value);

                <div class="title-picker-grid">${PROFILE_TITLE_PRESETS.map(t=>`<button type="button" class="title-option ${selected.includes(t)?'active':''}" data-act="title-option" data-title-option="${escapeHtml(t)}">✦ ${escapeHtml(t)}</button>`).join('')}</div>

                <div id="um-selected-titles" class="title-selected">${selected.map(t=>`<button type="button" class="title-remove" data-act="title-remove" data-title-remove="${escapeHtml(t)}">✕ ${escapeHtml(t)}</button>`).join('')}</div>

                <small style="display:block;margin-top:7px;color:var(--text-muted)">اختار لقب أو أكتر؛ هتظهر الألقاب جنب بعض. وتقدر تضيف لقب من اختيارك.</small>
            </div>`;
        }
        function syncSelectedTitles(){
            const hidden=document.getElementById('um-edit-title');
            const box=document.getElementById('um-selected-titles');
            if(!hidden||!box) return [];
            const arr=[...box.querySelectorAll('[data-title-remove]')].map(b=>b.getAttribute('data-title-remove')).filter(Boolean);
            hidden.value=arr.join('، ');
            return arr;
        }
        function userDisplayName(u){
            const n=(u?.full_name||u?.name||'').trim();
            return n || 'الاسم غير مسجل';
        }

        function userDisplayPhone(u){
            const p=(u?.phone_number||u?.phone||'').trim();
            return p || 'التليفون غير مسجل';
        }

        function userStatus(u){
            if(u?.role==='admin'||u?.role==='super_admin') return {key:'admin',label:'أدمن ذهبي',tone:'violet'};
            if(u?.role==='moderator') return {key:'moderator',label:'مشرف',tone:'blue'};
            if(u?.status==='revoked') return {key:'revoked',label:'مرفوض / موقوف',tone:'red'};
            if(u?.status==='pending') return {key:'pending',label:'في انتظار الموافقة',tone:'amber'};
            if(u?.account_type==='temporary'||u?.is_temporary===true||u?.must_change_credentials===true)
                return {key:'temporary',label:'حساب مؤقت',tone:'blue'};
            return {key:'approved',label:'عضو مقبول',tone:'green'};
        }

        function latestRequestForUser(userId){
            const arr=(state.userRequests||[]).filter(r=>String(r.user_id)===String(userId));
            return arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0] || null;
        }

        function requestLabel(req){
            if(!req) return '';
            if(req.request_type==='new_account') return 'طلب إنشاء حساب';
            if(req.request_type==='temporary_completion') return 'إكمال حساب مؤقت';
            if(req.request_type==='revoked_reapply') return 'طلب موافقة جديد';
            return 'طلب حساب';
        }

        async function openUsersManagement(){
            if(!isAdmin()) { showToast('غير مصرح به','error'); return; }
            state.view='users';
            state.usersLoading=true;
            render();
            try{
                const [profilesRes, requestsRes, messagesRes] = await Promise.all([
                    sb.from('profiles').select('*').order('created_at',{ascending:false}),
                    sb.from('account_requests').select('*').order('created_at',{ascending:false}),
                    sb.from('user_messages').select('*').order('created_at',{ascending:false}).limit(20)
                ]);
                if(profilesRes.error) throw profilesRes.error;
                if(requestsRes.error) throw requestsRes.error;
                if(messagesRes.error) throw messagesRes.error;
                state.users=profilesRes.data||[];
                state.userRequests=requestsRes.data||[];
                state.adminMessages=messagesRes.data||[];
                await loadWelcomeVideoLibrary();
                try{
                    const currentUserId = state.user?.id;
                    if(!currentUserId) throw new Error('انتهت جلسة الدخول.');
                    const {data:hidden}=await sb.from('admin_message_hidden').select('message_id').eq('user_id',currentUserId);
                    const hiddenIds=new Set((hidden||[]).map(x=>String(x.message_id)));
                    state.adminMessages=state.adminMessages.filter(m=>!hiddenIds.has(String(m.id)));
                }catch(_){}
            }catch(err){
                console.error(err);
                showToast(`تعذر تحميل المستخدمين: ${err.message||'خطأ غير معروف'}`,'error');
            }finally{
                state.usersLoading=false;
                render();
            }
        }

                const hay=[
                    u.full_name,u.name,u.email,u.phone,u.phone_number,u.role,u.status,u.account_type
                ].filter(Boolean).join(' ').toLowerCase();
                return matchFilter && (!q||hay.includes(q));
            });
        }

        // ════════════════════════════════════════════════════════════════════

        function attachEvents() {
            document.querySelectorAll('[data-act]').forEach(el => {
                el.removeEventListener('click', onAction);
                el.addEventListener('click', onAction);
            });

            // File inputs - manager avatar
            const managerAvatarInput=document.getElementById('manager-avatar');
            if(managerAvatarInput){ managerAvatarInput.removeEventListener('change',onManagerAvatarChange); managerAvatarInput.addEventListener('change',onManagerAvatarChange); }
            const managerPageAvatarInput=document.getElementById('manager-page-avatar-input');
            if(managerPageAvatarInput){
                managerPageAvatarInput.removeEventListener('change',onManagerPageAvatarChange);
                managerPageAvatarInput.addEventListener('change',onManagerPageAvatarChange);
            }

            // File inputs - avatar
            const avatarInput = document.getElementById('modal-avatar');
            if (avatarInput) {
                avatarInput.removeEventListener('change', onAvatarChange);
                avatarInput.addEventListener('change', onAvatarChange);
            }

            // File inputs - image
            const imgInput = document.getElementById('modal-image');
            if (imgInput) {
                imgInput.removeEventListener('change', onImageChange);
                imgInput.addEventListener('change', onImageChange);
            }

            // File inputs - file
            const fileInput = document.getElementById('modal-file');
            if (fileInput) {
                fileInput.removeEventListener('change', onFileChange);
                fileInput.addEventListener('change', onFileChange);
            }

            const userSearch = document.getElementById('userSearch');
            if(userSearch){
                userSearch.addEventListener('input', e=>{
                    state.usersSearch=e.target.value;
                    const caret=e.target.selectionStart;
                    render();
                    const next=document.getElementById('userSearch');
                    if(next){ next.focus(); try{next.setSelectionRange(caret,caret);}catch(_){ } }
                });
            }


            const wvAudience=document.getElementById('welcome-video-audience');
            if(wvAudience){
              wvAudience.addEventListener('change',()=>{
                const box=document.getElementById('welcome-video-recipients-box');
                if(box) box.classList.toggle('show', wvAudience.value==='selected');
              });
            }
            const wvLibrary=document.getElementById('welcome-video-library-select');
            if(wvLibrary){
              wvLibrary.addEventListener('change',()=>{
                const v=document.getElementById('welcome-video-admin-preview');
                const path=wvLibrary.value||state.welcomeVideoCampaign?.video_path||'';
                if(!v) return;
                if(path){v.src=publicStorageUrl('welcome-videos',path);v.style.display='block';} else {v.removeAttribute('src');v.style.display='none';}
              });
            }
            const vis = document.getElementById('content-visibility');
            if(vis){ vis.addEventListener('change',()=>{ const box=document.querySelector('.access-users-field'); if(box) box.style.display=vis.value==='selected'?'block':'none'; if(state.modal) state.modal.visibilityMode=vis.value; }); }
            const boldToggle=document.getElementById('text-bold-toggle');
            if(boldToggle){boldToggle.addEventListener('click',()=>{ if(state.modal){ state.modal.textBold=state.modal.textBold===false; } render(); });}
            document.querySelectorAll('[data-text-color]').forEach(btn=>btn.addEventListener('click',()=>{ if(state.modal){state.modal.textColor=btn.getAttribute('data-text-color')||'#111827'; render();} }));

            // Name input
            const nameInput = document.getElementById('modal-name');
            if (nameInput) {
                nameInput.removeEventListener('input', onNameInput);
                nameInput.addEventListener('input', onNameInput);
            }

        }

function onManagerPageAvatarChange(e){
            const f=e.target.files?.[0];

        function onAvatarChange(e) {

        function onNameInput(e) {

                state.modal.name = e.target.value;

        async function onAction(e) {
            const el = e.currentTarget;
            const act = el.dataset.act;

            // ─── Admin controls must never trigger the parent Card click ───
            if (el.closest('.card-admin-actions')) {
                e.stopPropagation();
            }

            // ─── Modal overlay: only close if click is directly on overlay ───
            if (act === 'close-modal-overlay') {
                // Only close if the click target is the overlay itself (not a child)
                if (e.target === el) {
                    closeModal();
                }
                return;
            }

            if (act === 'close-confirm-overlay') {
                if (e.target === el) {
                    closeConfirm();
                }
                return;
            }

            // ─── Any click inside a modal is never an overlay click ───
            if (el.closest('.modal') && act !== 'close-modal' && act !== 'close-confirm') {
                // Keep processing the button's own action, but never let it close the overlay.
                e.stopPropagation();
            }

            // ─── Standard actions ───
            if (act === 'close-modal') {
                const wasFirst = state.modal?.kind === 'first-welcome';
                closeModal();
                if (wasFirst) { if (!state.user.phone) openModal('phone-required',{}); else void showWelcomeVideoOnce(); }
                return;
            }
            if (act === 'close-confirm') {
                closeConfirm();
                return;
            }

            // ─── Stop propagation for any modal inner clicks ───
            if (el.dataset.stop) return;

            switch (act) {
                case 'login': {
                    // لا يوجد اختيار للدور هنا؛ الدور يأتي من Supabase.
                    return;
                }
                case 'open-admin-panel': {
                    if (!isAdmin()) {
                        showToast('غير مصرح به', 'error');
                        break;
                    }
                    await openUsersManagement();
                    break;
                }
                case 'user-filter': {
                    state.usersFilter = el.dataset.filter || 'all';
                    render();
                    break;
                }
                case 'refresh-users': {
                    await openUsersManagement();
                    break;
                }
                case 'user-details': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-details',{user:u});
                    break;
                }
                case 'user-edit': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-edit',{user:u});
                    break;
                }
                case 'user-welcome': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-welcome',{user:u,mode:'ready'});
                    break;
                }
                case 'welcome-mode': {
                    const u=state.modal?.user||state.users.find(x=>String(x.id)===String(state.modal?.userId));
                    openModal('user-welcome',{user:u,mode:el.dataset.mode==='custom'?'custom':'ready'});
                    break;
                }
                case 'send-user-welcome': {
                    const m=state.modal||{}; const u=m.user||{};
                    const custom=m.mode==='custom';
                    const title=(document.getElementById('welcome-message-title')?.value||'').trim();

                    const mediaFile=document.getElementById('welcome-message-media')?.files?.[0]||null;

        async function listWelcomeVideoObjects(path=''){
            const out=[];
            try{
                const {data,error}=await sb.storage.from('welcome-videos').list(path,{limit:100,offset:0,sortBy:{column:'name',order:'asc'}});
                if(error) throw error;
                for(const item of (data||[])){
                    if(!item?.name) continue;
                    const childPath=path ? `${path}/${item.name}` : item.name;
                    const isFolder=!item.id && !item.metadata;
                    if(isFolder){
                        const nested=await listWelcomeVideoObjects(childPath);
                        out.push(...nested);
                    }else{
                        const ext=(item.name.split('.').pop()||'').toLowerCase();
                        if(['mp4','webm','mov','m4v'].includes(ext)) out.push({path:childPath,name:item.name,size:item.metadata?.size||0,updated:item.updated_at||item.created_at||''});
                    }
                }
            }catch(err){ console.warn('welcome video library',err); }
            return out;
        }
        async function loadWelcomeVideoLibrary(){
            state.welcomeVideoLibrary=await listWelcomeVideoObjects('');
            return state.welcomeVideoLibrary;
        }

            try{
                const {data,error}=await sb.from('welcome_video_campaign').select('*').eq('id',1).maybeSingle();
                if(error) throw error;
                let recipient_ids=[];
                if(data?.audience_mode==='selected'){const r=await sb.from('welcome_video_recipients').select('user_id').eq('campaign_id',1);if(!r.error) recipient_ids=(r.data||[]).map(x=>x.user_id);}
                state.welcomeVideoCampaign=data?{...data,recipient_ids}:null;

        async function getWelcomeVideoToShow(){
            try{const {data,error}=await sb.rpc('should_show_welcome_video_for_me');if(error)throw error;if(!data?.should_show||!data?.video_path)return null;return publicStorageUrl('welcome-videos',data.video_path);}catch(_){return null;}
        }
        async function markWelcomeVideoViewed(){try{await sb.rpc('mark_welcome_video_viewed');}catch(_){}}
        async function showWelcomeVideoOnce(){
            if(!state.user || state.role==='admin') return;
            const url=await getWelcomeVideoToShow(); if(!url) return;
            const overlay=document.createElement('div'); overlay.className='welcome-video-overlay show';
            overlay.innerHTML=`<div class="welcome-video-shell"><video class="welcome-video" playsinline preload="auto" autoplay></video><div class="welcome-video-sound-gate" style="display:none"><button type="button" class="welcome-video-sound-btn">🔊 تشغيل الفيديو بالصوت</button></div></div>`;
            document.body.appendChild(overlay); const video=overlay.querySelector('video'), gate=overlay.querySelector('.welcome-video-sound-gate');
            video.src=url; video.muted=false; video.volume=1; let done=false;
            const finish=async()=>{if(done)return;done=true;await markWelcomeVideoViewed();overlay.remove();};
            video.addEventListener('ended',finish,{once:true}); video.addEventListener('error',()=>overlay.remove(),{once:true});
            const start=async()=>{try{video.muted=false;await video.play();gate.style.display='none';}catch(_){gate.style.display='flex';}};
            video.addEventListener('canplay',start,{once:true}); gate.querySelector('button').addEventListener('click',async()=>{try{video.muted=false;await video.play();gate.style.display='none';}catch(_){}}); setTimeout(start,300);
        }

        async function loadPlatformManager(){
            try{
                const {data,error}=await sb.from('platform_profile').select('*').eq('id',1).maybeSingle();
                if(error) throw error;
                if(data){ state.platformManager={id:data.id,name:data.public_name||'مدير المنصة',titles:Array.isArray(data.public_titles)?data.public_titles:[],message:data.public_message||'',avatar:publicStorageUrl('avatars',data.avatar_path||''),avatar_path:data.avatar_path||null,name_bold:data.public_name_bold!==false,name_color:data.public_name_color||'#111827'}; }
            }catch(_){ /* لا تمنع فتح المنصة إذا لم يكن سجل المدير موجودًا بعد */ }
        }

        async function bootApp(){
            try{
                const {data:{session}}=await sb.auth.getSession();
                if(!session?.user){renderAccessMessage('لا توجد جلسة دخول','افتح الموقع من البداية وسجّل الدخول أولًا.');return;}
                currentAuthUser = session.user;
                const {data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
                if(error)throw error;
                if(!profile){renderAccessMessage('الحساب غير مكتمل','توجد جلسة Auth لكن لا يوجد سجل لهذا المستخدم في profiles.');return;}
                const admin=profile.role==='admin';
                if(!admin&&profile.status==='revoked'){renderAccessMessage('الحساب موقوف','تواصل مع الإدارة لإعادة التفعيل.');return;}
                if(!admin&&profile.status==='pending'){renderAccessMessage('الحساب في انتظار الموافقة','بعد الموافقة ستتمكن من الدخول.');return;}
                if(!admin&&(profile.must_change_credentials||profile.account_type==='temporary'||profile.is_temporary===true)){renderAccessMessage('الحساب مؤقت','أكمل بيانات الحساب من الموقع من البداية أولًا.');return;}
                if(!admin&&profile.must_change_password){renderAccessMessage('تغيير كلمة السر مطلوب','سجّل الدخول من الموقع من البداية لتعيين كلمة سر جديدة قبل دخول المنصة.');return;}
                state.role=profile.role==='super_admin'?'super_admin':(admin?'admin':'member');
                state.user={name:profile.full_name||profile.name||session.user.user_metadata?.full_name||'عضو',email:profile.email||session.user.email||'',phone:profile.phone_number||profile.phone||'',avatar:publicStorageUrl('avatars',profile.avatar_path||profile.avatar_url), profile_title:profile.profile_title||'', isOwnerAdmin:!!profile.is_owner_admin};
                const firstOpen=!profile.first_opened_at&&!profile.first_seen_at;
                void sb.rpc('record_user_open').then(()=>{},()=>{});
                await Promise.all([loadData(),loadPlatformManager(),loadWelcomeVideoCampaign()]);state.view='home';render();
                if(firstOpen) openModal('first-welcome',{}); else await showWelcomeVideoOnce();
                try{
                    const {data:messages,error:messagesError}=await sb.rpc('get_my_unread_messages');
                    if(!messagesError && Array.isArray(messages) && messages.length){
                        state.pendingUserMessages=messages;
                        if(state.user.phone && !state.modal){
                            openModal('user-message',{messages});
                            const ids=messages.map(x=>x.id).filter(Boolean);
                            if(ids.length) void sb.rpc('mark_my_messages_read',{p_message_ids:ids}).then(()=>{},()=>{});
                        }
                    }
                }catch(_){}
                if(!state.user.phone && !state.modal){
                    openModal('phone-required',{});
                }
            }catch(e){console.error(e);renderAccessMessage('تعذر تحميل المنصة',e.message||'خطأ غير معروف.');}
        }
        let explicitLogout=false;
        sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&explicitLogout)location.replace('../index.html');});

        bootApp();

        console.log('المنصة · V11');
        console.log('👤 العضو:', state.user.name);
        console.log('📂 الأقسام:', state.sections.length);
    </script>
